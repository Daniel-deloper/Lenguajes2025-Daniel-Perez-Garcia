<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Semantica</title>
    <style>

         .boton-volver {
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #4a4eff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 10%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        .boton-volver:hover {
            transform: scale(1.05);
            background-color: #373cff;
        }

        body {
            font-family: Arial;
            background-color: #ffffff;
            padding: 10px;
        }

        .box {
            border: 2px solid #000000;
            margin: 10px auto;
        }

        header,
        main,
        section,
        article,
        figure,
        footer,
        nav,
        aside {
            display: block;
            margin: 5px 0;
            border: 1px solid black;
            border-radius: 6px;
            padding: 15px;
        }

        header {
            background-color: #2105bd;
        }

        main {
            background-color: #000000;
        }

        section {
            background-color: #feb3ea;
        }

        article {
            background-color: #239655;
        }

        figure {
            background-color: #ea5201;
        }

        footer {
            background-color: #6b79fd;
        }

        nav {
            background-color: #5b7efa;
        }

        aside {
            background-color: #ff5773;
        }

        .inline {
            display: inline-block;
            vertical-align: top;
        }

        .center {
            text-align: center;
        }

        .w100 {
            width: 100%;
        }

        .w90 {
            width: 90%;
        }

        .w80 {
            width: 80%;
        }

        .w70 {
            width: 70%;
        }

        .w60 {
            width: 60%;
        }

        .w50 {
            width: 50%;
        }

        .w40 {
            width: 40%;
        }

        .w30 {
            width: 30%;
        }

        .w20 {
            width: 20%;
        }

        .w10 {
            width: 10%;
        }
    </style>
</head>

<body>
    <header class="box center w80">

        <h1 class="inline w50">Web Semantica</h1>
        <aside class="inline w20">Elemento aside</aside>
    </header>
    <nav class="box w80 center"> <p>&lt; nav &gt</p> <a href="#">Enlace 1 </a><a href="#">Enlace 2 </a><a href="#">Enlace 3</a></nav>

    <main class="box w80 center">
        <section>
            <p>&lt; section &gt</p>
            <section class="inline 70px w70">
                <header>&lt; header &gt</header>
                <article>&lt; article &gt</article>
                <figure class="w40">&lt; figure &gt</figure>
                <footer>&lt; footer &gt</footer>
            </section>
            <section class="inline 20px w20">

                <article>&lt; article &gt</article>

                <article>&lt; article &gt</article>
            </section>
        </section>


        <section>
            <section class="inline 70px w70">
                <p>&lt; section &gt</p>
                <section>
                    <header>&lt; header &gt</header>
                    <article>&lt; article &gt</article>
                    <figure class="w40">&lt; figure &gt</figure>
                    <footer>&lt; footer &gt</footer>
                </section>
            </section>

            <section class="inline 30px w20">
                <p>&lt; section &gt</p>
                <aside>&lt; aside &gt</aside>

                <figure>&lt; figure &gt</figure>
            </section>
            <section class="center">
                <p>&lt; section &gt;</p>
                <aside class="inline 30px w80"><p>&lt; aside &gt</p></aside>
