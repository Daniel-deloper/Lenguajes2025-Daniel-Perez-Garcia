<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=devide-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <style>
      .boton-volver {
        margin-top: 20px;
        padding: 10px 18px;
        background-color: #4a4eff;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        width: 11%;
        text-align: center;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        transition: 0.2s;
      }

      .boton-volver:hover {
        transform: scale(1.05);
        background-color: #373cff;
      }

      .calc {
        width: 220px;
        background: #e6edf5;
        padding: 20px;
        border-radius: 16px;
        border: 10px solid #aab7c4;
        font-family: Arial, sans-serif;
      }
      .display {
        width: 100%;
        height: 40px;
        background: white;
        border: 1px solid #999;
        border-radius: 4px;
        text-align: right;
        padding: 8px;
        font-size: 22px;
        box-sizing: border-box;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 4px;
      }
      button {
        width: 100%;
        height: 35px;
        border: 1px solid #9aa8b8;
        background: #f2f6fa;
        border-radius: 4px;
        font-size: 15px;
      }
    </style>
  </head>
   <button class="boton-volver" onclick="window.location.href='../Trabajo_final/Trabajo_final.html'">Volver al menú principal</button>

  <body>
    <div class="calc">
      <div class="display">0</div>

      <table>
        <tr>
          <td><button>MC</button></td>
          <td><button>MR</button></td>
          <td><button>MS</button></td>
          <td><button>M+</button></td>
          <td><button>M-</button></td>
        </tr>
        <tr>
          <td><button>←</button></td>
          <td><button>CE</button></td>
          <td><button>C</button></td>
          <td><button>±</button></td>
          <td><button>√</button></td>
        </tr>
        <tr>
          <td><button>7</button></td>
          <td><button>8</button></td>
          <td><button>9</button></td>
          <td><button>/</button></td>
          <td><button>%</button></td>
        </tr>
        <tr>
          <td><button>4</button></td>
          <td><button>5</button></td>
          <td><button>6</button></td>
          <td><button>*</button></td>
          <td><button>1/x</button></td>
        </tr>
        <tr>
          <td><button>1</button></td>
          <td><button>2</button></td>
          <td><button>3</button></td>
          <td><button>-</button></td>
          <td rowspan="2"><button style="height: 78px">=</button></td>
        </tr>
        <tr>
          <td colspan="2"><button>0</button></td>
          <td><button>.</button></td>
          <td><button>+</button></td>
        </tr>
      </table>
    </div>
  </body>
</html>
