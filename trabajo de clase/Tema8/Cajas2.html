<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Figuras</title>
    <style>
        body {
            display: flex;
            gap: 80px;
            padding: 40px;
            font-family: Arial;
        }


        .columna {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }


        .cuadrado {
            width: 40px;
            height: 40px;
            display: block;
        }

        .tri {
            width: 100%;
            height: 100%;
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        .rojo {
            background: red;
        }

        .azul {
            background: blue;
        }

        .amarillo {
            background: yellow;
        }

        .verde {
            background: green;
        }


        .tri-grande {
            width: 200px;
            height: 200px;
            position: relative;
        }

        .tri1,
        .tri2,
        .tri3 {
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 50%, 50% 50%, 0 0);
        }

        .tri1 {
            background: red;
            transform: scaleX(-);
        }

        .tri2 {
            background: blue;
            transform: scaleX(-1);
        }

        .tri3 {
            background: green;
            transform: rotate(90deg);
        }

        .tri-abajo {
            width: 160px;
            height: 100px;
            background: blue;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }


        .circulo {
            width: 120px;
            height: 120px;
            background: #47b45c;
            border-radius: 50%;
        }

        .semi {
            width: 120px;
            height: 60px;
            background: #47b45c;
            border-radius: 0 0 60px 60px;
        }

        .semi-izq {
            width: 120px;
            height: 120px;
            background: #47b45c;
            border-radius: 60px 0 0 60px;
            clip-path: inset(0 50% 0 0);
        }

        .boton-volver {
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #4a4eff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 60%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        .boton-volver:hover {
            transform: scale(1.05);
            background-color: #373cff;
        }
    </style>
</head>

<body>

    <div class="columna">

        <div class="columna">

            <svg class="cuadrado-svg" viewBox="0 0 100 100" role="img"
                aria-label="Cuadrado formado por cuatro triángulos de colores">
                <polygon points="50,50 0,0 100,0" fill="#1e88e5" />
                <polygon points="50,50 100,0 100,100" fill="#ffd600" />
                <polygon points="50,50 100,100 0,100" fill="#43a047" />
                <polygon points="50,50 0,100 0,0" fill="#e53935" />
            </svg>



            <svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
                <polygon points="0,0 160,0 80,80" fill="blue" />
                <polygon points="0,0 0,160 80,80" fill="red" />
                <polygon points="0,160 160,160 80,80" fill="#43a047" />
            </svg>


            <div class="tri-abajo"></div>
        </div>


        <div class="columna">
            <div class="circulo"></div>
            <div class="semi-izq"></div>
            <div class="semi"></div>
        </div>

</body>
<button class="boton-volver" onclick="window.location.href='../Trabajo_final/Trabajo_final.html'">Volver al menú
    principal</button>

</html>
