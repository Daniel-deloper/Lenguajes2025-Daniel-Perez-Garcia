<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Posicionamiento 3</title>
    <style>
      * {
        height: 100%;
      }
      div.contenedor{
        overflow: hidden;
      }
      div.azul {
        background-color: blue;
        width: 100%;
        height: 20%;
      }
      div.rojo {
        background-color: red;
        width: 10%;
        height: 100%;
        float: left;
      }
      div.verde {
        background-color: green;
        width: 90%;
        height: 40%;
        float: right;
      }
      div.amarillo {
        background-color: yellow;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="azul">
      <p>Titulo largo en Azul</p>
    </div>
    <div class="contenedor">
      <div class="rojo">
        <p>Rojo</p>
      </div>
        <div class="verde">
          <p>Verde</p>
        </div>
        <div class="amarillo">
          <p>Amarillo</p>
        </div>
      </div>
    </div>
  </body>
</html>
