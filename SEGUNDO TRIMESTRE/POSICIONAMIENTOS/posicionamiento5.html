<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Posicionamiento 5</title>
    <style>
      * {
        height: 100%;
      }

      div.azul {
        background-color: blue;
        width: 100%;
        height: 20%;
      }
      div.gris {
        background-color: grey;
        width: 100%;
        height: 20%;
        float: inline-end;
      }
      div.rojo {
        background-color: red;
        width: 10%;
        height: 100%;
        float: left;
      }
      div.amarillo {
        background-color: yellow;
        width: 45%;
        float: right;
      }
      div.verde {
        background-color: green;
        width: 45%;
        float: left;
      }
      div.naranja {
        background-color: orange;
        height: 50%;
        width: 100%;
        float: left;
      }
      div.cuadrado-fijo {
        position: fixed;
        width: 100px;
        height: 100px;
        background-color: purple;
        bottom: 20px;
        right: 10%;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div class="azul">
      <p>Titulo largo en Azul</p>
    </div>
    <div class="gris">
      <p>Gris</p>
    </div>
    <div class="contenedor">
      <div class="rojo">
        <p>Rojo</p>
      </div>

      <div class="verde">
        <p>Verde</p>
      </div>

      <div class="amarillo">
        <p>Amarillo</p>
      </div>

      <div class="naranja">
        <p>Naranja</p>
      </div>
      <div class="cuadrado-fijo">
        <p>Morado</p>
      </div>
    </div>
  </body>
</html>
