<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posicionamiento 2</title>
    <body>
      <main>
        <div class="azul">
          <h1>Titulo largo en Azul</h1>
        </div>
        <div class="rojo">
          <p>Rojo</p>
        </div>
        <div class="verde">
          <p>Verde</p>
        </div>
        <div class="amarillo">
          <p>Amarillo</p>
        </div>
      </main>
    </body>
    <style>
        *{
            height: 100%;
        }
        div.azul{
            background-color: blue;
            width: 100%;
            height: 20%;
        }
        div.rojo{
            background-color: red;
            width: 50%;
            height: 60%;
            float: left;
        }
        div.verde{
            background-color: green;
            width: 50%;
            height: 60%;
            float: right;
        }
        div.amarillo{
            background-color: yellow;
            clear: both;
            width: 100%;
            height: 20%;
        }
    </style>
  </head>
</html>
