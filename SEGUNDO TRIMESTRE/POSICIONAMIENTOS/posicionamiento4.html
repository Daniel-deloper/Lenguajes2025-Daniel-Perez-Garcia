<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Posicionamiento 4</title>
    <style>
      * {
        height: 100%;
      }
      div.azul {
        background-color: blue;
        width: 100%;
        height: 20%;
      }
      div.rojo {
        background-color: red;
        width: 10%;
        height: 100%;
        float: left;
      }
      div.amarillo {
        background-color: yellow;
        width: 45%;
        float: right;
      }
      div.verde {
        background-color: green;
        width: 45%;
        float: right;
      }
      div.naranja{
        background-color: orange;
        height: 5%;
        width: 100%;     
        float: left;     
      }
    </style>
  </head>
  <body>
    <div class="azul">
      <p>Titulo largo en Azul</p>
    </div>

    <div class="contenedor">
      <div class="rojo">
        <p>Rojo</p>
      </div>

      <div class="verde">
        <p>Verde</p>
      </div>

      <div class="amarillo">
        <p>Amarillo</p>
      </div>

      <div class="naranja">
        <p>Naranja</p>
      </div>
    </div>
  </body>
</html>
