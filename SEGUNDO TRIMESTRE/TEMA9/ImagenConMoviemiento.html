<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen con movimiento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background-color: #1f2a44;
            color: white;
            text-align: center;
            padding: 15px;
        }

        
        .contenedor {
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        
        .imagen-central {
            width: 320px;
            max-width: 85%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .texto {
            position: absolute;
            bottom: 30px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
        }

        @media (min-width: 1024px) {
            .contenedor {
                background-image: url("imgin1.png");
            }

            .imagen-central {
                content: url("imagin2.png");
            }

            .texto::after {
                content: "Pantalla grande";
            }
        }

        @media (min-width: 600px) and (max-width: 1023px) {
            .contenedor {
                background-image: url("imagin3.png");
            }

            .imagen-central {
                content: url("Imagin4.png");
            }

            .texto::after {
                content: "Pantalla mediana";
            }
        }

        @media (max-width: 599px) {
            .contenedor {
                background-image: url("Imagen5.png");
            }

            .imagen-central {
                content: url("Imagen6.png");
            }

            .texto {
                font-size: 16px;
            }

            .texto::after {
                content: "Pantalla pequeña";
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Imagen con movimiento</h1>
    </header>

    <main class="contenedor">

        
        <img class="imagen-central" alt="Imagen adaptativa">

        
        <div class="texto"></div>

    </main>

</body>
</html>
