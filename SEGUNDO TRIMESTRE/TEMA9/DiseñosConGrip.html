<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Diseño en 12 columnas</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #c6c3c3;
        padding: 40px;
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 6px;
        margin-bottom: 20px;
      }

      .box {
        background: #f4d484;
        padding: 40px 0;
        text-align: center;
        font-weight: bold;
        border-radius: 4px;
      }
      .col-num {
        text-align: center;
        font-weight: bold;
        color: #000;
      }
    </style>
  </head>

  <body>
    <h2>Diseño en 12 columnas</h2>

    <div class="grid">
    <div class="col-num">1</div>
    <div class="col-num">2</div>
    <div class="col-num">3</div>
    <div class="col-num">4</div>
    <div class="col-num">5</div>
    <div class="col-num">6</div>
    <div class="col-num">7</div>
    <div class="col-num">8</div>
    <div class="col-num">9</div>
    <div class="col-num">10</div>
    <div class="col-num">11</div>
    <div class="col-num">12</div>
</div>

    <div class="grid">
      <div class="box" style="grid-column: 1 / 7">Mitad</div>
      <div class="box" style="grid-column: 7 / 13">Mitad</div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: 1 / 5">Tercio</div>
      <div class="box" style="grid-column: 5 / 9">Tercio</div>
      <div class="box" style="grid-column: 9 / 13">Tercio</div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: 1 / 4">Cuarto</div>
      <div class="box" style="grid-column: 4 / 7">Cuarto</div>
      <div class="box" style="grid-column: 7 / 10">Cuarto</div>
      <div class="box" style="grid-column: 10 / 13">Cuarto</div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: 1 / 3">Sexto</div>
      <div class="box" style="grid-column: 3 / 5">Sexto</div>
      <div class="box" style="grid-column: 5 / 7">Sexto</div>
      <div class="box" style="grid-column: 7 / 9">Sexto</div>
      <div class="box" style="grid-column: 9 / 11">Sexto</div>
      <div class="box" style="grid-column: 11 / 13">Sexto</div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: 3 / 5"></div>
      <div class="box" style="grid-column: 6 / 8"></div>
      <div class="box" style="grid-column: 9 / 11"></div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: 2 / 4"></div>
      <div class="box" style="grid-column: 5 / 9"></div>
      <div class="box" style="grid-column: 10 / 12"></div>
    </div>

    <div class="grid">
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
      <div class="box" style="grid-column: span 1"></div>
    </div>
  </body>
</html>
