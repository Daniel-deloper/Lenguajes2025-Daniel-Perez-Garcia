<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo App</title>
  <style>
    body {
      background: #e6e9f0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 220px;
      border: 1px solid #cfd6e0;
      background: #f4f6fb;
    }

    .header {
      background: #5b7bb2;
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 14px;
    }

    .content {
      padding: 10px;
      background: #9aaed1;
    }

    .card {
      color: white;
      text-align: center;
      padding: 12px 0;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 2px;
    }

    .one { background: #4caf50; }
    .two { background: #f44336; }
    .three { background: #2196f3; }
    .four { background: #f8a5a5; color: #333; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">Demo App</div>
    <div class="content">
      <div class="card one">1</div>
      <div class="card two">2</div>
      <div class="card three">3</div>
      <div class="card four">4</div>
    </div>
  </div>
</body>
</html>
