<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tablero de Ajedrez</title>
    <style>
       .boton-volver {
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #4a4eff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 10%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        .boton-volver:hover {
            transform: scale(1.05);
            background-color: #373cff;}

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #eee;
        font-family: Arial;
      }

      .frame {
        padding: 20px;
        background: #d8b98a;
        border: 8px solid #c8a675;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.4) inset;
      }

      table {
        border-collapse: collapse;
        margin: auto;
      }

      th {
        width: 100px;
        height: 100px;
        text-align: center;
        font-weight: bold;
        color: #4a3a28;
      }

      td {
        width: 48px;
        height: 48px;
      }

      .light {
        background: #e6c79c;
        background-size: cover;
      }

      .dark {
        background: #4d3424;
      }

      .empty {
        background: transparent !important;
      }
      img {
        width: 90px;
        height: 90px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <table>
        <tr>
          <th></th>
          <th>A</th>
          <th>B</th>
          <th>C</th>
          <th>D</th>
          <th>E</th>
          <th>F</th>
          <th>G</th>
          <th>H</th>
          <th></th>
        </tr>

        <tr>
          <th>8</th>

          <td class="light"><img src="reina-blanca.png"/></td>
          <td class="dark"><img src="rey-blanco.png"/></td>
          <td class="light"><img src="alfil-blanco.png"/></td>
          <td class="dark"><img src="caballo-blanco.png"/></td>
          <td class="light"><img src="torre-blanca.png"/></td>
          <th>8</th>
        </tr>

        <tr>
          <th>7</th>
          <td class="light"><img src="peon-blanco.png"/></td>
          <td class="dark"><img src="peon-blanco.png"/></td>
          <td class="light"><img src="peon-blanco.png"/></td>
          <td class="dark"><img src="peon-blanco.png"/></td>
          <td class="light"><img src="peon-blanco.png"/></td>
          <td class="dark"><img src="peon-blanco.png"/></td>
          <td class="light"><img src="peon-blanco.png"/></td>
          <td class="dark"><img src="peon-blanco.png"/></td>
          <th>7</th>
        </tr>

        <tr>

          <td class="light"></td>
          <td class="dark"></td>
          <td class="light"></td>
          <td class="dark"></td>
          <td class="light"></td>
          <td class="dark"></td>
          <td class="light"></td>
          <th>6</th>

        <tr>

    </div>
  </body>
  <button class="boton-volver" onclick="window.location.href='../Trabajo_final/index.html'">Volver al menú principal</button>
</html>
